# the straight-across junctions only (nina's gap-cards review §5, the architect's ruling): 730 (S10 #1-8, from its two major
# arms 3 and -2); at 1135 and 82 (the old #18, #30) the minor arms only turn onto the ego's road. 1082 (Scenario1's #157-160,
# "S1.157") is OUT: a cluster of fragment edges (the adversary's approach -35 is 0.1 m after -11's 0.2 m and a split; the
# ego's 34 is 2.3 m after a merge), so neither can start back on the same straight
dt: 0.1
ticks: 900
sumo: {ticks: 1800, back: 60, directions: [right, left]}   # both sides at each site: the source has left 49x, right 25x;
# left is the near half, the ego's conflict 7.6-7.9 m into 730 against 18.1-18.4 m (nina's 2c review §1)   # a red phase can outlast the exerciser's budget (Town03 #30 waited 30 s at a light);
# the S10 sites are 14-23 m before the junction, inside the 2.2 s TTA at once: the ego starts 60 m back
ego: {v: 11.1}
exerciser: {ego_s: 300.0, dest: 460.0, side_prio: false}
params:
  tta: {value: 2.2, range: [2.2, 2.2], default: 2.2, drives: actors.adversary.trigger.tta, threshold: 1.85, safe: above}
  # TTA 2.2 s OR 12 m to the collision point (:277-284); threshold: the ego's stop from 11.1 m/s at 6 m/s² (1.85 s)
actors:   # still at the side road's start; it crosses at 16.7 m/s from when the ego is TTA s from the junction (s 400)
  - id: adversary
    kind: car
    mode: scripted
    at: {road: side, s: 0.0, from: right}   # the source's `direction` (right): its arm right of the ego's heading
    sync: true      # SUMO: SyncArrival to the conflict point once triggered, held from the ego's last 1 s
    v: 0.0
    moving: false
    breaks_rules: true
    trigger: {at: junction, tta: 2.2, dist: 12.0}
    script: [{when: trigger, go: true, speed: 16.7}]
infractions: {scenario: []}
expect: {arrived: true, collisions: 0, violations: 0}
