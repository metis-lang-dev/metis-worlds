dt: 0.1
ticks: 1200
ego: {v: 11.1}
exerciser: {skip: "the exerciser's crosswalk w_0 is a zebra (the walker's priority: a walker waiting at its curb holds the ego, and the source's trigger, the ego's TTA to the crossing, never fires): a mid-block crossing is SUMO's"}
params:
  distance: {value: 40, range: [15, 113], default: 12, drives: actors.walker.at.ahead, threshold: 15.0, safe: above}
  # the crossing point `distance` m past the trigger point (:187, :231): the class default 12, the Leaderboard route files 15-113 (value 40);
  # threshold: the ego.s stop from 11.1 m/s at the responder.s brake_min 4 m/s² takes 15 m (the class default 12 is inside it)
actors:
  - id: walker
    kind: pedestrian
    mode: scripted
    at: {ahead: 40, side: right}            # the source's direction 'right' (:191): from the right roadside across
    crossing_angle: 0                       # :178, the route files -4..20
    v: 0.0
    moving: false
    # InTimeToArrivalToLocation 2.1 s (+0.1 per 5 degrees of angle, :179-180) OR within 6 m of the collision point (:181)
    trigger: {tta: 2.1, dist: 6.0, at: crosswalk}
    script: [{when: trigger, go: true, v: 2.0}]   # 2.0 m/s (:177) across the whole road (:327)
infractions: {scenario: []}
expect: {arrived: true, collisions: 0, violations: 0}
