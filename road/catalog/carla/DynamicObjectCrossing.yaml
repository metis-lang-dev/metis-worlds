patches:
  - {what: "the blocker (static.prop.vendingmachine, :188)", from: "a prop 1.5 m beyond the road's edge on the sidewalk, the walker behind it (:257)", to: "none", why: "our nets have no sidewalk (nina's walker check); on a lane it would block the ego's lane, which the source never does", by: opus, date: 2026-11-06}
  - {what: "the walker", from: "a CARLA walker on the sidewalk, 1.2 m off it (:274)", to: "a host-side body on a virtual crosswalk 1.5 m beyond the road's edge (world/walkers.py)", why: "no SUMO person can walk on our nets; the architect's ruling (scenario-catalog step 4)", by: opus, date: 2026-11-06}
