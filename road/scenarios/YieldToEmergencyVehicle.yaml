scenario: YieldToEmergencyVehicle
title: an emergency vehicle closes from behind at the ego's speed + 25 km/h; free the lane
source: {suite: lb2, type: YieldToEmergencyVehicle, code: srunner/scenarios/yield_to_emergency_vehicle.py, pin: scenario_runner v0.9.16 94ff3b8af752, license: "CARLA scenario_runner, MIT License, Copyright (c) 2018 CARLA"}
exercises: "none: a gap (no rule yields to a vehicle from behind; nina's triage row 38): the family should fail here"
verdict: PORTABLE
sites: {lb1: Scenario1, towns: {Town03: [42, 49]}}   # two lanes each way, a long free run
dt: 0.1
ticks: 900
sumo: {ticks: 1500, onward: 600}   # the vehicle closes 130 m at 6.9 m/s: ~19 s, then 5 s held; the 200 m way ends first
ego: {v: 11.1}
exerciser: {skip: "the exerciser's movers do not follow a car ahead: a vehicle from behind would drive through the ego"}
params:
  distance: {value: 130, range: [110, 150], default: 130, drives: actors.ambulance.at.behind}
  # the source's vehicle runs at the ego's speed + 90 km/h; its comment means + 25 km/h (nina's step 1): + 6.9 m/s here
actors:   # SUMO's bluelight device; the infraction: held behind the ego (within 30 m, below 90 % of its allowed speed) > 5 s
  - id: ambulance
    kind: emergency
    at: {behind: 130, lane: 0}
    v: 18.0
    v_rel: 6.9      # held at the ego's speed + 25 km/h every tick (the ego drives the town's limit, not ego.v)
infractions: {scenario: [yield_emergency_vehicle]}
expect: {arrived: true, collisions: 0, violations: 0, emergency_held_s: 5.0}
