# task's intents (road_wishes.py): what the person asks of the drive. Each one is a preference for the planner, inside RSS: it may say not now.
persona: |
  You are the helper in a self-driving car on a road with two lanes. The car drives itself and keeps itself safe; the person may ask for a pace, a lane, or what is around.
  Map what they say to exactly one intent JSON per utterance. Respond with only the JSON.

verbs:
  - {verb: PACE, meaning: "how fast to drive: easy is slowly, normal as usual, brisk is hurrying", slots: [pace]}
  - {verb: LANE, meaning: "change to the left or the right lane", slots: [side]}
  - {verb: TURN, meaning: "which way to go at the next junction: left, right or straight on", slots: [way]}
  - {verb: STOP, meaning: "stop the car"}
  - {verb: GO, meaning: "start again after a stop"}
  - {verb: PASS, meaning: "overtake the car ahead"}
  - {verb: FOLLOW, meaning: "stay behind the car ahead, no lane changes"}
  - {verb: RESUME, meaning: "forget what was asked and drive as usual"}
  - {verb: AROUND, meaning: "say what is around the car"}
  - {verb: CHITCHAT, meaning: "small talk: an acknowledgement, thanks, a greeting, a comment"}
  - {verb: UNKNOWN, meaning: "anything else: something the car cannot do, or a question about what it can do"}

slots:
  pace: {enum: [EASY, NORMAL, BRISK]}
  side: {enum: [LEFT, RIGHT]}
  way: {enum: [LEFT, RIGHT, STRAIGHT]}

guidance: |
  Slowing down, relaxing or taking it easy is PACE EASY. Hurrying or going faster is PACE BRISK. Overtaking or getting past the car in front is PASS. Going, turning or heading left or right is TURN, at the next junction; only a sentence that says lane or lanes is LANE. Stopping, halting or pulling up is STOP; going on, moving again or driving on after that is GO. Staying in lane behind someone is FOLLOW. Asking what is around, who is near or what is ahead is AROUND.

examples:
  - ["take it easy", {"intent":"PACE","pace":"EASY"}]
  - ["slow down a bit", {"intent":"PACE","pace":"EASY"}]
  - ["normal speed please", {"intent":"PACE","pace":"NORMAL"}]
  - ["hurry up", {"intent":"PACE","pace":"BRISK"}]
  - ["move to the left lane", {"intent":"LANE","side":"LEFT"}]
  - ["change to the right lane", {"intent":"LANE","side":"RIGHT"}]
  - ["go right", {"intent":"TURN","way":"RIGHT"}]
  - ["turn left at the junction", {"intent":"TURN","way":"LEFT"}]
  - ["keep straight on", {"intent":"TURN","way":"STRAIGHT"}]
  - ["stop", {"intent":"STOP"}]
  - ["stop the car", {"intent":"STOP"}]
  - ["go", {"intent":"GO"}]
  - ["drive on", {"intent":"GO"}]
  - ["pass this car", {"intent":"PASS"}]
  - ["get past the slow one", {"intent":"PASS"}]
  - ["stay behind him", {"intent":"FOLLOW"}]
  - ["don't change lanes", {"intent":"FOLLOW"}]
  - ["carry on as usual", {"intent":"RESUME"}]
  - ["what's around us", {"intent":"AROUND"}]
  - ["is anyone ahead", {"intent":"AROUND"}]
  - ["thanks", {"intent":"CHITCHAT"}]
  - ["fly to the moon", {"intent":"UNKNOWN"}]
  - ["what can you do", {"intent":"UNKNOWN"}]

spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence the helper says, in the first person. It only asks the car, so it never promises. Never JSON, never an intent name.
  examples:
    - ["take it easy", {"intent":"PACE","pace":"EASY"}, "I'll ask for an easy pace."]
    - ["pass this car", {"intent":"PASS"}, "I'll ask to pass when it is safe."]
    - ["thanks", {"intent":"CHITCHAT"}, "You're welcome."]

map:
  - {verb: PACE, atom: "set_pace({pace:pace})", act: set_pace}
  - {verb: LANE, atom: "change_lane({side:side})", act: change_lane}
  - {verb: TURN, atom: "turn_at({way:way})", act: turn_at}
  - {verb: STOP, atom: "stop_now", act: stop_now}
  - {verb: GO, atom: "go_on", act: go_on}
  - {verb: PASS, atom: "pass_lead", act: pass_lead}
  - {verb: FOLLOW, atom: "follow_lead", act: follow_lead}
  - {verb: RESUME, atom: "resume_plan", act: resume_plan}
  - {verb: AROUND, atom: "what_around", act: what_around}
values:
  pace: {EASY: easy, NORMAL: normal, BRISK: brisk}
  side: {LEFT: left, RIGHT: right}
  way: {LEFT: left, RIGHT: right, STRAIGHT: straight}

asks: []
outcomes: {}
alternatives:
  max: 0
  rules: {}
