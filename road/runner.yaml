# The road world's HEADLESS SCENARIO RUNNER (metis-plugin s-df4ff191; RUNTIME-INTERFACE v1.5 §6). The Metis plugin's
# runner_start runs it with the agent's args appended (e.g. '--card FollowLeadingVehicle'); its runs are the runtime
# named 'road' (runtime_connect road follows them from run to run). {python}: the plugin's METIS_PYTHON (the Live's venv,
# with metis-agent's runtime package); the road family (METIS_HOME) and the session's PYTHONPATH (metis-agent's runtime,
# metispy's SDK) come from the session; SUMO (as road/demo.sh finds it) and the road's own python paths the runner sets
# itself, so no env here; see runner/README.md.
name: road
command: "{python}"
args: [runner/road_runner.py, --workspace, "{workspace}", --name, road]
ready_s: 30
