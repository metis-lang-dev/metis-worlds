# metis-worlds CI: the libraries the worlds share (libs/), pure python — the worlds themselves need their game data
# and engines (ALFWorld's 2.3 GB of games, NetHack's NLE) and run on the dev machine (each world's setup.sh, tests/).
name: ci
on:
  push:
  pull_request:
jobs:
  libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: semantic-world (installed editable, as the worlds' setup.sh does)
        run: |
          python -m pip install -q -e libs/semantic-world pytest
          python -m pytest -q libs/semantic-world/tests
  # road/tests (road-sync s-4169b42d): the exerciser, the packages' cases and traces against metisc, and the road tree under
  # Live's latch (test_road_sync), with the public siblings at their heads: metispy as metis-catalog's job installs it,
  # metis-agent --no-deps (road_tree needs no model), metisc built here.
  road-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-worlds
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-agent
          path: metis-agent
      - name: the road family's pin
        id: fam
        run: echo "catalog=$(tr -d '[:space:]' < metis-worlds/road/domains/catalog.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          ref: ${{ steps.fam.outputs.catalog }}
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: the road tests (the family through METIS_HOME, road-family s-f62c0ed8)
        run: |
          python -m pip install -q pyyaml pytest -e ./metispy -e metis-worlds/libs/semantic-world
          python -m pip install -q --no-deps -e metis-agent/py
          cd metis-worlds && METIS_HOME="$GITHUB_WORKSPACE/metis-catalog/domains/road" python -m pytest -q road/tests
      # scenario-catalog step 5: every card the exerciser plays against its verdict.exerciser; a verdict that moved EITHER
      # way fails the run (road/docs/SCENARIO-CARD.md §6); the table and the coverage on the run's page
      - name: the catalog on the exerciser (a moved verdict fails)
        run: |
          cd metis-worlds
          export METIS_HOME="$GITHUB_WORKSPACE/metis-catalog/domains/road"
          python road/tools/scenario_run.py check road/catalog --host exerciser
          python road/tools/scenario_run.py coverage --host exerciser
  # spec 17 §4 (linker s-5908724a step 2): road's composition links to one image (metisc --link: every L-check over
  # the I-checks, the derived director compared with road_director), its hash == road/domains/image.golden.
  # alfworld's and minihack's trees are generated from the game data (world/gen_hier.py, world/mh_hier.py), which
  # this CI does not have; their link is gated in metis-lang's corpus (gate 15). alfworld's room tree (kitchen 13 as a
  # room: the person's tasks, map-queries s-396939dc step 3) is checked here from its snapshot, alfworld/tests/.room_tree
  # (world/gen_room_tree.py; a dev-machine test keeps it current): metisc --interface with no error, so a type-name
  # clash with the director's routing type (alf-tasks step 2's `kind`, I6) fails CI, not the person's session.
  road-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-worlds
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - name: the road family's pin
        id: fam
        run: echo "catalog=$(tr -d '[:space:]' < metis-worlds/road/domains/catalog.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          ref: ${{ steps.fam.outputs.catalog }}
          path: metis-catalog
      - name: metisc
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - name: the link (road's image hash; the family through METIS_HOME, road-family s-f62c0ed8)
        run: |
          cd metis-worlds/road/domains
          METIS_HOME="$GITHUB_WORKSPACE/metis-catalog/domains/road" "$GITHUB_WORKSPACE/metis-lang/src/metisc" --link composition.yaml --check | tee "$RUNNER_TEMP/link.txt"
          grep -qx "image road v-$(cat image.golden)" "$RUNNER_TEMP/link.txt"
      - name: the room tree's interface (alfworld, kitchen 13 as a room)
        run: |
          cd metis-worlds/alfworld/tests/.room_tree
          rc=0
          METIS_HOME="$GITHUB_WORKSPACE/metispy/metis/catalog" "$GITHUB_WORKSPACE/metis-lang/src/metisc" \
              --interface domains/hier/composition.yaml > "$RUNNER_TEMP/iface.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/iface.txt"
          [ "$rc" -eq 0 ] && ! grep -q '^error' "$RUNNER_TEMP/iface.txt"
      # alfworld's bundle (alf-bundle s-b53cc7ab): domains/hier/ as the workspace's composition; `make` derives the plain
      # bases from the committed tree ones (world/gen_hier.py plain: metispy, semantic-world) and links; the hash == image.golden
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: alfworld's bundle (its sources the generator's, its link the golden)
        run: |
          python -m pip install -q pyyaml pytest -e ./metispy -e metis-worlds/libs/semantic-world
          cd metis-worlds/alfworld
          METISC="$GITHUB_WORKSPACE/metis-lang/src/metisc" python -m pytest -q tests/test_bundle.py
          cd domains/hier
          METIS_HOME="$GITHUB_WORKSPACE/metispy/metis/catalog" make METISC="$GITHUB_WORKSPACE/metis-lang/src/metisc" PYTHON=python | tee "$RUNNER_TEMP/alf.txt"
          grep -qx "image alfworld v-$(cat image.golden)" "$RUNNER_TEMP/alf.txt"
