# scenario-catalog step 5: the catalog on SUMO, nightly and on demand, in its two sets (SCENARIO-CARD §6c): the REGRESSION
# set fails on any card not at pass; the WORKING set never fails and posts its table and the promotion candidates. Each
# set's cards (`scenario_run.py list --host sumo --set S --chunks 20`) in up to 20 groups, one job per group (a line per card); a verdict that moved EITHER way fails the run
# (road/docs/SCENARIO-CARD.md §6). SUMO 1.18 from PyPI (eclipse-sumo), as road/setup-sumo.sh's wheel path; the family at
# road/domains/catalog.pin, metisc built as in ci.yml's road-tests. Panzer keeps the harvest and the law-change reruns.
name: catalog-sumo
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:                                    # a change to this workflow runs it once, so it is tried on its branch before main
    paths: [".github/workflows/catalog-sumo.yml"]
jobs:
  cards:
    runs-on: ubuntu-24.04
    outputs:
      cards: ${{ steps.list.outputs.cards }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      # metisc ONCE, here, for every matrix job: apt on a fresh hosted runner can wait silently on the dpkg lock
      # (unattended-upgrades at boot) until the job's cap (two jobs of 8dd4c20's run); 10 min bounds it in one place
      - name: metisc
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ocaml-nox
          make -C metis-lang metisc
      - uses: actions/upload-artifact@v4
        with:
          name: metisc-${{ github.sha }}
          path: metis-lang/src/metisc
          retention-days: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: list
        run: |
          python -m pip install -q pyyaml
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          jobs = []
          for st in ("regression", "working"):
              out = subprocess.run(["python", "road/tools/scenario_run.py", "list", "road/catalog", "--host", "sumo", "--set", st,
                                    "--chunks", "20"], capture_output=True, text=True, check=True).stdout
              jobs += [{"set": st, "cards": g} for g in json.loads(out)]
          print("cards=" + json.dumps(jobs))
          PY
  sumo:
    needs: cards
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.cards.outputs.cards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: metis-worlds
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-lang
          ref: master
          path: metis-lang
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metispy
          path: metispy
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-agent
          path: metis-agent
      - name: the road family's pin
        id: fam
        run: echo "catalog=$(tr -d '[:space:]' < metis-worlds/road/domains/catalog.pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: metis-lang-dev/metis-catalog
          ref: ${{ steps.fam.outputs.catalog }}
          path: metis-catalog
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: metisc (built once in the cards job)
        uses: actions/download-artifact@v4
        with:
          name: metisc-${{ github.sha }}
          path: metis-lang/src
      - run: chmod +x metis-lang/src/metisc && metis-lang/src/metisc --version 2>&1 | head -1 || true
      - name: the Live, SUMO 1.18 (PyPI)
        run: |
          python -m pip install -q pyyaml pytest rtree==1.4.1 eclipse-sumo==1.18.0 traci==1.18.0 sumolib==1.18.0 \
            -e ./metispy -e metis-worlds/libs/semantic-world
          python -m pip install -q --no-deps -e metis-agent/py
          sumo --version | head -1
      - name: the ${{ matrix.set }} set's group against verdict.sumo
        run: |
          cd metis-worlds
          export METIS_HOME="$GITHUB_WORKSPACE/metis-catalog/domains/road" METIS_AGENT_PY="$(which python)" OMP_NUM_THREADS=1
          export SUMO_HOME="$(python -c 'import sumo; print(sumo.SUMO_HOME)')"
          python road/tools/scenario_run.py check ${{ matrix.cards }} --host sumo --set ${{ matrix.set }}
  coverage:
    needs: sumo
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -q pyyaml
          python road/tools/scenario_run.py coverage road/catalog
