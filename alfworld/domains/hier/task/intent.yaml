# task's intents (alf-hierarchy step 2, opus): what the person asks the household agent to get
# done — one verb, FETCH(object, receptacle), whose atom is the task domain's goal fetch(O, R): the
# planner then asks the specialists (goto, open, take, put) one sub-goal at a time. A TEMPLATE:
# world/gen_hier.py fills the `object` enum with the task's targets (target/1: the only objects
# the task instance has) and `receptacle` with every receptacle, and keeps the examples whose
# values the game has; a receptacle the task does not want is the program's refusal (not_dest → wrong_dest),
# an object it does not move has no value here (UNKNOWN). The program: ../task_domain.llp.
persona: |
  You are a household robot. The person asks you to get something done with one object: bring
  it somewhere, put it away, fetch it to a place. Map what they say to exactly one intent JSON
  per utterance. Respond with only the JSON.

verbs:
  - {verb: FETCH, meaning: "get an object from wherever it is and put it in or on a receptacle (the whole errand)"}
  - {verb: CHITCHAT, meaning: "small talk, not an errand: an acknowledgement (okay, I understand, got it), thanks, a greeting, a comment, a question to you that asks for no errand (but what you can do is UNKNOWN)"}
  - {verb: UNKNOWN, meaning: "an errand you cannot do here: one step on its own (just go, just open, just pick up), an object not in the schema, a question about where things are, a question about what you can do or what to ask (the world card answers it)"}

slots:
  object: {enum: []}
  receptacle: {enum: []}

guidance: |
  Things are their kind and their number written together in capitals, no space: "tomato 2"
  is TOMATO2, "drawer 3" is DRAWER3. A kind named without a number, or one the room has only
  one of, is number 1: "the tomato" is TOMATO1, "the fridge" is FRIDGE1, "the counter" is
  COUNTERTOP1, "the table" is DININGTABLE1. Bringing, fetching, moving, putting away, getting
  an object TO a receptacle is FETCH, and so is "put X in R" when the person wants the whole
  errand done. An object that is not in the schema's object list is UNKNOWN (never another
  object in its place). Just going somewhere, just opening or just picking up is UNKNOWN here.
  Words that ask for no errand at all (okay, understood, thanks, hello, how are you) are
  CHITCHAT: the person is talking with you, the errand in progress goes on. A question about
  what you can do or what they can ask is UNKNOWN: the world card answers it.

examples:
  - ["fetch the tomato to the fridge", {"intent":"FETCH","object":"TOMATO1","receptacle":"FRIDGE1"}]
  - ["bring the tomato to the microwave", {"intent":"FETCH","object":"TOMATO1","receptacle":"MICROWAVE1"}]
  - ["put a tomato in the microwave", {"intent":"FETCH","object":"TOMATO1","receptacle":"MICROWAVE1"}]
  - ["move the second tomato to the table", {"intent":"FETCH","object":"TOMATO2","receptacle":"DININGTABLE1"}]
  - ["get the mug onto the counter", {"intent":"FETCH","object":"MUG1","receptacle":"COUNTERTOP1"}]
  - ["put the apple away in the fridge", {"intent":"FETCH","object":"APPLE1","receptacle":"FRIDGE1"}]
  - ["bring the soap to the toilet", {"intent":"FETCH","object":"SOAPBOTTLE1","receptacle":"TOILET1"}]
  - ["take the book to the desk", {"intent":"FETCH","object":"BOOK1","receptacle":"DESK1"}]
  - ["go to the fridge", {"intent":"UNKNOWN"}]
  - ["pick up the tomato", {"intent":"UNKNOWN"}]
  - ["open the microwave", {"intent":"UNKNOWN"}]
  - ["where is the tomato", {"intent":"UNKNOWN"}]
  - ["what can you do", {"intent":"UNKNOWN"}]
  - ["okay I understood", {"intent":"CHITCHAT"}]
  - ["thanks", {"intent":"CHITCHAT"}]
  - ["hello there", {"intent":"CHITCHAT"}]
  - ["what time is it", {"intent":"CHITCHAT"}]

spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence the robot says, in the first
    person. Never JSON, never an intent name.
  examples:
    - ["fetch the tomato to the fridge", {"intent":"FETCH","object":"TOMATO1","receptacle":"FRIDGE1"}, "I'll get the tomato into the fridge."]
    - ["bring the tomato to the microwave", {"intent":"FETCH","object":"TOMATO1","receptacle":"MICROWAVE1"}, "Bringing the tomato to the microwave."]
    - ["take the book to the desk", {"intent":"FETCH","object":"BOOK1","receptacle":"DESK1"}, "Taking the book to the desk."]
    - ["okay I understood", {"intent":"CHITCHAT"}, "Good."]
    - ["thanks", {"intent":"CHITCHAT"}, "You're welcome."]

map:
  - {verb: FETCH, atom: "fetch({object:object},{receptacle:receptacle})", act: fetch}
values:
  object: {}
  receptacle: {}

asks: []
outcomes: {goto: progress, open: progress, take: progress, put: progress, done: done, stuck: refused, wrong_dest: refused}
alternatives:
  max: 0
  rules: {}
