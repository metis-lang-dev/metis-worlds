    - {intent: FETCH, object: TOMATO1, receptacle: MICROWAVE1}
    - Bringing the tomato to the microwave.
  - - move the pepper shaker to a shelf
    - {intent: FETCH, object: PEPPERSHAKER1, receptacle: SHELF}
    - Let me see.
  - - heat the apple
    - {intent: NOTASK, chore: HEATING}
