# metis-worlds/alfworld: the world's code (world/: alf_host and its modules) as an installable distribution
# (metis-packages s-65778b98 step 3), so a consumer imports it from its python instead of putting
# world/ on sys.path. Installed EDITABLE into the world's venv (setup.sh; the policy driver, pi/policy,
# runs there): `pip install -e metis-worlds/alfworld`. Editable only: the modules read the world's
# domains/ and data beside world/. The modules are top-level, as the world's own scripts import them.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "metis-world-alfworld"
version = "0.1.0"
description = "The metis ALFWorld world: its host, its gym child, its instance generators"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = ["metispy>=0.1.3"]   # semantic-world (libs/, not on PyPI) is installed editable beside it by setup.sh

[tool.setuptools]
package-dir = {"" = "world"}
py-modules = [
  "alf_gym",
  "alf_host",
  "director_host",
  "families",
  "gen_eval",
  "gen_hier",
  "gen_instance",
  "ground",
  "semantic_map",
]
