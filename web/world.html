<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World Page</title>
<link rel="stylesheet" href="map.css">
<link rel="stylesheet" href="vendor/panel.css">
<script type="importmap">{"imports":{"fsttm-web/tts":"./vendor/tts.js","fsttm-web/ws":"./vendor/ws.js","fsttm-web/panel":"./vendor/panel.js"}}</script>
<style>
  :root { --w-bg: #f4f1ea; --w-fg: #1d1d1b; --w-mute: #6b6760; --w-line: #d6d0c4; --w-card: #fff; --w-on: #2d8a4e; --w-att: #d4632a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --w-bg: #16171a; --w-fg: #e8e6e1; --w-mute: #9a968e; --w-line: #33353a; --w-card: #202226; --w-on: #5bc27e; --w-att: #f08a4b; } }
  :root[data-theme="dark"] { --w-bg: #16171a; --w-fg: #e8e6e1; --w-mute: #9a968e; --w-line: #33353a; --w-card: #202226; --w-on: #5bc27e; --w-att: #f08a4b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--w-bg); color: var(--w-fg); font: 14px/1.4 system-ui, sans-serif; }
  #root { display: flex; flex-direction: column; min-height: 100vh; outline: none; }
  [data-w]:focus-visible, [data-w]:focus { outline: 2px solid var(--wm-focus); outline-offset: -2px; }
  [data-j] { position: relative; outline: 2px dashed var(--wm-focus); }
  [data-j]::after { content: attr(data-j); position: absolute; top: -7px; left: -7px; z-index: 9; min-width: 1.3em; text-align: center;
    color: #000; background: #6ee7f0; border-radius: 3px; font-size: 11px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 8px 16px; border-bottom: 1px solid var(--w-line); }
  header h1 { font-size: 16px; margin: 0; } #conn { color: var(--w-mute); font-size: 12px; }
  #ctrl { display: flex; gap: 6px; } #ctrl button { font: inherit; padding: 2px 10px; }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; align-items: flex-start; }
  #map { flex: 1 1 360px; min-width: 0; }
  aside { flex: 1 1 320px; display: flex; flex-direction: column; gap: 12px; min-width: 0; max-width: 560px; }
  .dock { background: var(--w-card); border: 1px solid var(--w-line); border-radius: 6px; padding: 8px 10px; }
  .dock[hidden] { display: none; }
  .dock h2 { font-size: 13px; margin: 0 0 6px; display: flex; justify-content: space-between; color: var(--w-mute); text-transform: uppercase; letter-spacing: .04em; }
  #talkpanel { min-height: 160px; max-height: 260px; display: flex; flex-direction: column; }
  #hlist { list-style: none; margin: 0; padding: 0; }
  #hlist li { display: flex; flex-wrap: wrap; gap: 6px; padding: 3px 6px; border-radius: 4px; position: relative; }
  #hlist li.on .st { color: var(--w-on); } #hlist li.off { color: var(--w-mute); }
  #hlist li.att { background: color-mix(in srgb, var(--w-att) 15%, transparent); } #hlist li.att .st { color: var(--w-att); font-weight: 600; }
  #hlist li[data-domain="task"] { cursor: pointer; }
  #hlist li[data-n]::before { content: attr(data-n); min-width: 1.4em; text-align: center; color: #000; background: #6ee7f0; border-radius: 3px; }
  #hlist .k, #hlist .g { font-size: 12px; } #hlist .g { color: var(--w-mute); font-family: ui-monospace, monospace; }
  #hstate { font-size: 12px; text-transform: none; letter-spacing: 0; }
  #jlog { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; font-size: 12px; }
  #jlog li { padding: 1px 0; } #jlog .who { color: var(--w-mute); display: inline-block; min-width: 3.5em; }
  #jlog .j-you { font-weight: 600; }
  @media (max-width: 600px) { header, main { padding: 8px 16px; } aside { max-width: none; } }
</style>
</head>
<body>
<div id="root" data-w="root" data-role="container" tabindex="-1">
  <header data-w="band" data-role="container" tabindex="-1">
    <h1>World</h1>
    <div id="ctrl" data-w="ctrl" data-role="composite" tabindex="-1" aria-label="the replay">
      <button id="play" data-w="play" data-role="item" type="button">play</button>
      <button id="step" data-w="step" data-role="item" type="button">step</button>
    </div>
    <span id="conn"></span>
  </header>
  <main>
    <section id="map" data-w="map" data-role="list" tabindex="-1" aria-label="the map"></section>
    <aside>
      <section class="dock" id="talk" data-w="talk" data-role="dock" tabindex="-1" aria-label="the dialog">
        <h2>talk</h2><div id="talkpanel" data-port-off></div>
      </section>
      <section class="dock" id="hierarchy" data-w="hierarchy" data-role="dock" tabindex="-1" aria-label="the hierarchy">
        <h2>hierarchy <span id="hstate"></span></h2>
        <ul id="hlist" data-w="hlist" data-role="list" tabindex="-1" aria-label="the domains"></ul>
      </section>
      <section class="dock" id="journal" data-w="journal" data-role="dock" tabindex="-1" aria-label="the journal">
        <h2>journal</h2>
        <ol id="jlog" data-w="jlog" data-role="container" tabindex="-1" aria-label="the journal's lines"></ol>
      </section>
    </aside>
  </main>
</div>
<script type="module">
const t = new URLSearchParams(location.search).get('theme');
if (t) document.documentElement.dataset.theme = t;
import('./world.js').catch(e => { document.getElementById('conn').textContent = 'the page: ' + (e?.message || e); throw e; });
</script>
</body>
</html>
