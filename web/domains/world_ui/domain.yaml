# world_ui — the world page (web/world.html: the map, the task card, the dialog band, the
# hierarchy, the journal) over the lifted voice-navigation base (alf-demo step 3b): ui_domain.llp
# holds every rule, world_ui.llp the page's facts; the page is the host (effects out, every
# focus the person makes back through the input port).
program: world_ui.llp
host: world_ui_host.py:make
intent: {spec: intent.yaml}
clock: {beats: 1, lockstep: true}
display: the world page's widgets and the person's focus
line: "world_ui — voice navigation over the world page; the lifted base ui_domain.llp, the page's facts world_ui.llp"
# a result is spoken as the fired rule's %% line (metis-agent: console-nav step 2 F4)
voice: line
