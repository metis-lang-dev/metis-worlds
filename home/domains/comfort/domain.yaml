# Advice about a room's air from the thermometers (not wired yet) and the units' state. Switches nothing.
display: the comfort advice
line: "comfort: a room turning cold, warm or humid, and what would help"
voice: third
program: comfort.llp
host: home_host.py:comfort
intent: {spec: intent.yaml}
clock: {beats: 1, period: 1}
records: records/
# the semantic world (metis-worlds libs/semantic-world/go): the beliefs this package reads, quantised (spec 16)
beliefs: {present_b: {port: present}, cold_b: {port: cold}, warm_b: {port: warm}, humid_b: {port: humid}, out_cold_b: {port: out_cold}}
levels: {presence: {from: {belief: present}, at: [0.3, 0.7], names: [nobody, maybe_someone, someone]}, chill: {from: {belief: cold}, at: [0.5, 0.9], names: [not_cold, maybe_cold, cold]}, heat: {from: {belief: warm}, at: [0.5, 0.9], names: [not_warm, maybe_warm, warm]}, damp: {from: {belief: humid}, at: [0.5, 0.9], names: [dry, maybe_humid, humid]}, outside: {from: {belief: out_cold}, at: [0.5], names: [mild_out, cold_out]}}
