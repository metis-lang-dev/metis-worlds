# Comfort's intents: a person's question about a room's air. python -m metis.intents gen comfort
persona: |
  You are the voice of a flat's smart home. The person is talking to YOU. Map a question about how
  warm, cold or stuffy a room is to exactly one intent JSON. Respond with only the JSON.
verbs:
  - {verb: QUERY, meaning: "how is the air (temperature, humidity) in a room"}
slots:
  room: string
guidance: |
  `room` is the room in the person's words.
examples:
  - ["how warm is the bedroom", {"intent":"QUERY","room":"bedroom"}]
  - ["is it cold in the lab", {"intent":"QUERY","room":"lab"}]
spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence said out loud.
  examples:
    - ["how warm is the bedroom", {"intent":"QUERY","room":"bedroom"}, "Let me check the bedroom."]
map:
  - {verb: QUERY, atom: "cmd_comfort({room:room})", act: comfort}
outcomes: {said: done, refused: refused}

# --- handles (generated by world/gen_map.py from world/home.map.json: do not edit below) ---
handles:
  room:
    r1: {description: ["bedroom"]}
    r2: {description: ["lab", "workshop"]}
    r3: {description: ["living room", "lounge"]}
    r4: {description: ["kitchen"]}
fallback: {room: rx}
standing: [rx]
