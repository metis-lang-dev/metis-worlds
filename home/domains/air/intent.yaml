# The ventilation's intents (the two recuperators): generated grammar: python -m metis.intents gen air
persona: |
  You are the voice of a flat's smart home. The person is talking to YOU. Map what the person
  says about the ventilation to exactly one intent JSON per utterance. Respond with only the JSON.
verbs:
  - {verb: "ON", meaning: "start a ventilation unit"}
  - {verb: "OFF", meaning: "stop a ventilation unit"}
  - {verb: NIGHT, meaning: "night mode: quiet and slow"}
  - {verb: BOOST, meaning: "boost: fast for a while"}
  - {verb: NORMAL, meaning: "back to the normal speed (out of night or boost)"}
  - {verb: HEAT_ON, meaning: "the unit's heater on"}
  - {verb: HEAT_OFF, meaning: "the unit's heater off"}
  - {verb: WINTER_ON, meaning: "winter mode on"}
  - {verb: WINTER_OFF, meaning: "winter mode off"}
slots:
  device: string
guidance: |
  `device` is the unit in the person's words with its room ("bedroom ventilation", "lab fan").
  When no room is said, `device` is the bare word ("ventilation", "heating"): never guess a room;
  the home asks which one.
examples:
  - ["turn off the ventilation", {"intent":"OFF","device":"ventilation"}]
  - ["turn on the heating", {"intent":"HEAT_ON","device":"heating"}]
  - ["start the ventilation in the bedroom", {"intent":"ON","device":"bedroom ventilation"}]
  - ["stop the lab fan", {"intent":"OFF","device":"lab fan"}]
  - ["put the bedroom vent on night mode", {"intent":"NIGHT","device":"bedroom ventilation"}]
  - ["boost the lab ventilation", {"intent":"BOOST","device":"lab ventilation"}]
  - ["back to normal speed in the bedroom", {"intent":"NORMAL","device":"bedroom ventilation"}]
  - ["turn on the heater in the lab ventilation", {"intent":"HEAT_ON","device":"lab ventilation"}]
  - ["heater off in the bedroom", {"intent":"HEAT_OFF","device":"bedroom ventilation"}]
  - ["winter mode on for the lab recuperator", {"intent":"WINTER_ON","device":"lab recuperator"}]
spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence said out loud, in the first
    person. It is never JSON and never an intent name. When the home cannot or will not do
    something, say so plainly.
  examples:
    - ["open the front door", {"intent":"UNKNOWN"}, "I can't do that."]
map:
  - {verb: "ON", atom: "cmd_air_on({device:unit})", act: "on"}
  - {verb: "OFF", atom: "cmd_air_off({device:unit})", act: "off"}
  - {verb: NIGHT, atom: "cmd_air_night({device:unit})", act: night}
  - {verb: BOOST, atom: "cmd_air_boost({device:unit})", act: boost}
  - {verb: NORMAL, atom: "cmd_air_normal({device:unit})", act: normal}
  - {verb: HEAT_ON, atom: "cmd_heater_on({device:unit})", act: heat}
  - {verb: HEAT_OFF, atom: "cmd_heater_off({device:unit})", act: heat}
  - {verb: WINTER_ON, atom: "cmd_winter_on({device:unit})", act: winter}
  - {verb: WINTER_OFF, atom: "cmd_winter_off({device:unit})", act: winter}
outcomes: {done: done, refused: refused}

# --- handles (generated by world/gen_map.py from world/home.map.json: do not edit below) ---
handles:
  unit:
    u1: {description: ["bedroom ventilation", "bedroom vent", "bedroom fan", "bedroom recuperator"]}
    u2: {description: ["lab ventilation", "lab vent", "lab fan", "lab recuperator"]}
    ua: {description: ["ventilation", "vent", "fan", "fans", "recuperator", "heating", "heater", "the ventilation", "the heating"]}
fallback: {unit: ux}
standing: [ux, ua]
