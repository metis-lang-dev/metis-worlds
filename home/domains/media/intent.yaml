# The media's intents: the TV and the infrared devices. python -m metis.intents gen media
persona: |
  You are the voice of a flat's smart home. The person is talking to YOU. Map what the person
  says about the TV or an infrared device to exactly one intent JSON per utterance. Respond with only the JSON.
verbs:
  - {verb: "ON", meaning: "turn the TV on"}
  - {verb: "OFF", meaning: "turn the TV off"}
  - {verb: LOUDER, meaning: "the TV louder"}
  - {verb: QUIETER, meaning: "the TV quieter"}
  - {verb: IR, meaning: "press a key (power, up, down) on an infrared device's remote"}
slots:
  device: string
  key: {enum: [POWER, UP, DOWN]}
guidance: |
  `device` is the device in the person's words. IR uses `device` and `key`.
examples:
  - ["turn the tv on", {"intent":"ON","device":"tv"}]
  - ["switch off the television", {"intent":"OFF","device":"television"}]
  - ["louder", {"intent":"LOUDER","device":"tv"}]
  - ["turn the tv down", {"intent":"QUIETER","device":"tv"}]
  - ["turn on the air conditioner", {"intent":"IR","device":"air conditioner","key":"POWER"}]
  - ["make the ac warmer", {"intent":"IR","device":"ac","key":"UP"}]
spoken:
  heading: Spoken response (after the JSON)
  text: |
    After the JSON comes "Spoken response:" and one short sentence said out loud, in the first
    person. It is never JSON and never an intent name. When the home cannot or will not do
    something, say so plainly.
  examples:
    - ["open the front door", {"intent":"UNKNOWN"}, "I can't do that."]
map:
  - {verb: "ON", atom: "cmd_tv_on({device:tv})", act: "on"}
  - {verb: "OFF", atom: "cmd_tv_off({device:tv})", act: "off"}
  - {verb: LOUDER, atom: "cmd_tv_louder({device:tv})", act: volume}
  - {verb: QUIETER, atom: "cmd_tv_quieter({device:tv})", act: volume}
  - {verb: IR, atom: "cmd_ir({device:irdev},{key:keys})", act: ir}
values:
  keys: {POWER: power, UP: up, DOWN: down}
outcomes: {done: done, refused: refused}

# --- handles (generated by world/gen_map.py from world/home.map.json: do not edit below) ---
handles:
  tv:
    t1: {description: ["tv", "television", "telly"]}
  irdev:
    ir1: {description: ["air conditioner", "ac"]}
fallback: {tv: tx, irdev: irx}
standing: [tx, irx]
