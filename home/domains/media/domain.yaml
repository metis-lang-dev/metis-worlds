# The TV and the infrared devices over roles t1, ir1.
display: the media
line: "media: the TV on, off, louder, quieter; infrared devices by their remote's keys (the IR remote is not wired yet)"
voice: own
program: media.llp
host: home_host.py:media
intent: {spec: intent.yaml}
clock: {beats: 1, period: 1}
records: records/
commands: [tv_up, tv_down, tv_louder, tv_quieter, ir_send, sweep_tv]
